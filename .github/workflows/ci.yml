name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-tests-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check access controls on changed SQL tables
        env:
          BASE_SHA: \${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t SQL_FILES < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.sql')
          if [ "\${#SQL_FILES[@]}" -gt 0 ]; then
            node scripts/check-supabase-table-access.mjs "\${SQL_FILES[@]}"
          else
            echo "No changed SQL files to inspect."
          fi

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build
