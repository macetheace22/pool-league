name: Keep Supabase Active

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Update Supabase heartbeat
        run: |
          echo "Updating Supabase heartbeat..."

          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_heartbeat?id=eq.1" \
            -X PATCH \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "{\"last_ping\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}")

          echo "HTTP status: $HTTP_CODE"
          cat response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Supabase heartbeat failed."
            exit 1
          fi

          echo "Supabase heartbeat successful."
